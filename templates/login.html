<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Faturas do atacado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { font-family: Inter, "Segoe UI", sans-serif; margin: 0; background: #f3f4f6; color: #1f2937;
         min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 28px 28px 24px; width: 100%; max-width: 360px; }
  h1 { font-size: 16px; font-weight: 700; text-transform: uppercase; color: #111827; margin: 0 0 4px; }
  p { font-size: 12px; color: #6b7280; margin: 0 0 20px; }
  label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; color: #4b5563; margin-bottom: 6px; }
  input { font: inherit; font-size: 13px; width: 100%; height: 38px; padding: 0 12px; border: 1px solid #d1d5db; border-radius: 6px; }
  input:focus { outline: 2px solid #c7d2fe; border-color: #a5b4fc; }
  .erro input { border-color: #dc2626; }
  .msg { font-size: 12px; color: #dc2626; margin-top: 6px; }
  button { font: inherit; font-size: 12px; font-weight: 700; text-transform: uppercase; width: 100%; height: 38px; margin-top: 18px;
           border: 0; border-radius: 6px; background: #d32f3a; color: #fff; cursor: pointer; }
  button:hover { background: #b9252f; }
</style>
</head>
<body>
<form class="card {{ 'erro' if erro }}" method="post">
  <h1>🐵 Bebêtenkitê - Faturas do atacado</h1>
  <p>Digite a senha para acessar o relatório.</p>
  <input type="hidden" name="proximo" value="{{ proximo }}">
  <label for="senha">Senha</label>
  <input id="senha" name="senha" type="password" autofocus autocomplete="current-password">
  {% if erro %}<div class="msg">{{ erro }}</div>{% endif %}
  <button>Entrar</button>
</form>
</body>
</html>
